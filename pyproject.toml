[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "testpulse"
version = "0.1.0"
description = "Historical analysis of automated test results"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<0.120",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy>=2.0,<3",
    "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.11,<0.12",
]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
markers = ["integration: tests that require PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"backend/src/database/*.py" = ["UP007"]
"backend/src/api/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
