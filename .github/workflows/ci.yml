name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testpulse_test
          POSTGRES_USER: testpulse
          POSTGRES_PASSWORD: testpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testpulse -d testpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://testpulse:testpulse@127.0.0.1:5432/testpulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: testpulse --help
      - run: testpulse-worker --help
      - run: python -m alembic upgrade head
      - run: python -m pytest --junitxml=test-results.xml
      - name: Upload test results to TestPulse
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TESTPULSE_URL: ${{ vars.TESTPULSE_URL }}
          TESTPULSE_PROJECT_ID: ${{ vars.TESTPULSE_PROJECT_ID }}
          TESTPULSE_API_TOKEN: ${{ secrets.TESTPULSE_API_TOKEN }}
          TESTPULSE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ ! -f test-results.xml ]; then
            echo "::notice::Skipping TestPulse upload because no JUnit report was generated."
            exit 0
          fi
          if [ -z "$TESTPULSE_URL" ] || [ -z "$TESTPULSE_PROJECT_ID" ] || [ -z "$TESTPULSE_API_TOKEN" ]; then
            echo "::notice::Skipping TestPulse upload; configure TESTPULSE_URL and TESTPULSE_PROJECT_ID repository variables and the TESTPULSE_API_TOKEN secret."
            exit 0
          fi
          testpulse \
            --url "$TESTPULSE_URL" \
            --project "$TESTPULSE_PROJECT_ID" \
            --report test-results.xml \
            --commit "$GITHUB_SHA" \
            --branch "$TESTPULSE_BRANCH"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

