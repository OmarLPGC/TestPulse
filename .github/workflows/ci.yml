name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testpulse_test
          POSTGRES_USER: testpulse
          POSTGRES_PASSWORD: testpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testpulse -d testpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://testpulse:testpulse@127.0.0.1:5432/testpulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: testpulse --help
      - run: testpulse-worker --help
      - run: python -m alembic upgrade head
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
